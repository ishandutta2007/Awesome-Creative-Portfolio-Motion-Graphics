<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="45%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#180a2e" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(129, 140, 248, 0.25)" />
    </pattern>
  </defs>

  <style>
    .anim-pulse {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .anim-orbit1 {
      animation: orbitFloat1 8s ease-in-out infinite alternate;
    }
    .anim-orbit2 {
      animation: orbitFloat2 10s ease-in-out infinite alternate;
    }
    .anim-orbit3 {
      animation: orbitFloat3 7s ease-in-out infinite alternate;
    }
    .anim-wave {
      animation: waveMove 12s linear infinite;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.75; transform: scale(1.05); }
    }
    @keyframes orbitFloat1 {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-22px) rotate(8deg); }
    }
    @keyframes orbitFloat2 {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(26px) rotate(-10deg); }
    }
    @keyframes orbitFloat3 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-18px) translateX(15px); }
    }
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <g class="anim-pulse" style="transform-origin: 200px 100px;">
    <circle cx="180" cy="90" r="130" fill="url(#glowPurple)" filter="url(#neonBlur)" />
  </g>
  <g class="anim-pulse" style="transform-origin: 1020px 320px; animation-delay: 2s;">
    <circle cx="1020" cy="320" r="140" fill="url(#glowCyan)" filter="url(#neonBlur)" />
  </g>
  <g class="anim-pulse" style="transform-origin: 900px 90px; animation-delay: 1s;">
    <circle cx="920" cy="90" r="90" fill="url(#glowAmber)" filter="url(#neonBlur)" opacity="0.45" />
  </g>

  <!-- Dynamic Decorative Waves (Behind Text) -->
  <path d="M -50 320 Q 250 210, 600 310 T 1250 240" fill="none" stroke="rgba(129, 140, 248, 0.28)" stroke-width="3" stroke-dasharray="10 8" class="anim-wave" />
  <path d="M -50 340 Q 350 420, 750 280 T 1250 330" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="2" stroke-dasharray="8 6" class="anim-wave" />

  <!-- Floating Dynamic Geometric Motifs (Motion Graphics Visuals - Left & Right Flanks) -->
  <g class="anim-orbit1" style="transform-origin: 120px 240px;">
    <!-- 3D Isometric Cube Outline -->
    <path d="M 110 200 L 160 170 L 210 200 L 160 230 Z" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="2" />
    <path d="M 110 200 L 110 255 L 160 285 L 160 230 Z" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="2" />
    <path d="M 210 200 L 210 255 L 160 285 L 160 230 Z" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="2" />
  </g>

  <g class="anim-orbit2" style="transform-origin: 1060px 170px;">
    <!-- Kinetic Torus / Sphere Lines -->
    <ellipse cx="1060" cy="170" rx="60" ry="24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.75" transform="rotate(-25 1060 170)" />
    <ellipse cx="1060" cy="170" rx="60" ry="24" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.7" transform="rotate(35 1060 170)" />
    <circle cx="1060" cy="170" r="14" fill="#c084fc" filter="url(#subtleGlow)" />
  </g>

  <g class="anim-orbit3" style="transform-origin: 1000px 280px;">
    <!-- Timeline Keyframe Diamond Nodes -->
    <rect x="980" y="260" width="22" height="22" rx="4" transform="rotate(45 991 271)" fill="rgba(0, 245, 212, 0.25)" stroke="#00f5d4" stroke-width="2" />
    <line x1="940" y1="271" x2="1060" y2="271" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- FOREGROUND: Solid, Crystal Clear, High-Contrast Title & Subtitle Elements -->
  <!-- Category Pill Badge -->
  <g transform="translate(600, 75)">
    <rect x="-185" y="-18" width="370" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(147, 197, 253, 0.45)" stroke-width="1.5" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ⚡ CURATED CREATIVE ECOSYSTEM
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
    Creative Portfolio &amp; Motion Graphics
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Interactive Portfolios • WebGL 3D Showcases • Motion Graphics Engines • Kinetic Typography
  </text>

  <!-- Feature Highlights Row (Pills in Foreground) -->
  <g transform="translate(600, 270)">
    <!-- Pill 1: Three.js & WebGL -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🎮 WebGL / Three.js</text>
    </g>
    <!-- Pill 2: Motion Engines -->
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">✨ Motion &amp; Animation</text>
    </g>
    <!-- Pill 3: Programmatic Video -->
    <g transform="translate(110, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.2" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🎬 Remotion &amp; Canvas</text>
    </g>
    <!-- Pill 4: Designer Portfolios -->
    <g transform="translate(320, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(0, 245, 212, 0.4)" stroke-width="1.2" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🎨 Portfolios &amp; SaaS</text>
    </g>
  </g>

  <!-- Clean Bottom Accent Line -->
  <line x1="150" y1="365" x2="1050" y2="365" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  <circle cx="600" cy="365" r="4" fill="#a855f7" />
  <circle cx="560" cy="365" r="2.5" fill="#38bdf8" />
  <circle cx="640" cy="365" r="2.5" fill="#f472b6" />
</svg>